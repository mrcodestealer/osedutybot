[Service]
# ---- Force CPU backend (no GPU on this ECS) ----
Environment="CUDA_VISIBLE_DEVICES="
Environment="HIP_VISIBLE_DEVICES="
Environment="ROCR_VISIBLE_DEVICES="
Environment="NVIDIA_VISIBLE_DEVICES="
Environment="GGML_VK_VISIBLE_DEVICES="
Environment="OLLAMA_VULKAN=false"
Environment="OLLAMA_LLM_LIBRARY=cpu"

# ---- Model residency: keep models pinned in RAM forever ----
# (the /v1 OpenAI endpoint ignores keep_alive in the request body,
#  so this env var is the ONLY thing that prevents 5-min auto-unload)
Environment="OLLAMA_KEEP_ALIVE=-1"
# chat model (qwen3.6:35b-a3b) + command router (qwen2.5:0.5b)
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="OLLAMA_MAX_QUEUE=64"

# ---- Inference settings ----
# NOTE: OLLAMA_NUM_THREADS removed - it is NOT a valid Ollama variable.
# Ollama automatically uses all physical CPU cores for generation.
Environment="OLLAMA_CONTEXT_LENGTH=8192"
Environment="OLLAMA_FLASH_ATTENTION=0"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="LLAMA_ARG_NO_WARMUP=1"
Environment="LLAMA_ARG_FIT=off"

# ---- Give Ollama priority on CPU and RAM ----
# Highest practical CPU share + scheduling priority
Nice=-10
CPUWeight=1000
IOWeight=1000
# Protect the loaded model from being paged out to swap
# (paged-out model = replies suddenly 10-50x slower)
MemoryLow=70%
# Never let the OOM killer pick ollama
OOMScoreAdjust=-900
LimitNOFILE=1048576

Restart=always
RestartSec=5
